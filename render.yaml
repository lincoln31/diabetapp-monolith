# Blueprint de Render (spec fase 16): despliegue del backend en el plan gratuito.
# `sync: false` = la variable existe pero su valor se pega a mano en el panel de Render,
# nunca en este archivo (spec fase 16, RF-16.6; P1 de la constitución).
services:
  - type: web
    name: diabetapp-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: diabetapp-backend
    buildCommand: npm ci && npx prisma generate && npm run build
    # `preDeployCommand` no existe en el plan gratuito de Render (solo en los pagos), así que
    # la migración va en el arranque (spec fase 16, D-16.3 revisada): `prisma migrate deploy`
    # no hace nada si el esquema ya está al día, así que es seguro correrlo en cada arranque,
    # no solo en cada despliegue.
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Render está detrás de un proxy: sin esto, express-rate-limit limitaría por la IP
      # de Render, no la del celular (spec fase 2, RNF-2.5).
      - key: TRUST_PROXY
        value: '1'
      # Generar con: cd diabetapp-backend && npm run generate-secret
      - key: JWT_SECRET
        sync: false
      # URL de Neon CON el *pooler* (host termina en "-pooler..."), para las consultas normales.
      - key: DATABASE_URL
        sync: false
      # La misma URL de Neon SIN "-pooler" en el host: prisma migrate deploy la necesita
      # porque el *pooler* (PgBouncer) no soporta los bloqueos que usan las migraciones.
      - key: DIRECT_URL
        sync: false
